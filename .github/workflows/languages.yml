name: Update languages stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: languages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # GH_PAT is required to read private repositories (GITHUB_TOKEN only sees this one).
      - run: node scripts/languages.js
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update global language stats"
            git pull --rebase
            git push
          # Scheduled workflows are disabled after 60 days without repo activity.
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git pull --rebase
            git push
          fi
