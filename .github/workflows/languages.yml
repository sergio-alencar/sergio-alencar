name: Update languages stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: languages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GH_PAT is required to read private repositories (GITHUB_TOKEN only sees this one).
      - run: node scripts/languages.js
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update global language stats"
            git push
          # Scheduled workflows are disabled after 60 days without repo activity.
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push
          fi
